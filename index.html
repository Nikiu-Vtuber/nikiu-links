<meta name="color-scheme" content="dark light">
<title>Nikiu Vtuber - Links</title>

<style>
:root{
  --blue:#1fa8e0; --blue-dk:#0f7fb0;
  --bg1:#e7eaed; --bg2:#dde1e5; --tile1:#f2f4f6; --tile2:#dfe3e6; --tile-border:#c7ccd1;
  --text:#4c4f54; --muted:#8b9095;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); box-sizing:border-box;
}
body[data-theme="dark"]{
  --bg1:#1c1f24; --bg2:#15171b; --tile1:#2b2f36; --tile2:#22262c; --tile-border:#3a3f46;
  --text:#e6e9ec; --muted:#9098a0;
}
*{box-sizing:border-box;}
body{margin:0;min-height:100%;font-family:'Nunito Sans',sans-serif;color:var(--text);
  background:repeating-linear-gradient(0deg,var(--bg1),var(--bg1) 2px,var(--bg2) 3px,var(--bg1) 4px);
  display:flex;justify-content:center;padding:48px 16px 32px;}
h1{font-family:'Fredoka',sans-serif;font-weight:600;}
.page{width:100%;max-width:420px;text-align:center;position:relative;}
.theme-toggle{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;background:var(--tile1);border:1px solid var(--tile-border);border-radius:50%;width:40px;height:40px;font-size:1.1rem;cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center;}
.avatar-wrap{width:104px;height:104px;margin:0 auto 14px;border-radius:50%;border:3px solid var(--tile-border);background:transparent;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.avatar-wrap img{width:100%;height:100%;object-fit:contain;}
.name{font-size:1.5rem;margin:0 0 22px;cursor:pointer;}
.name:hover{color:var(--blue-dk);}
.links{display:flex;flex-direction:column;gap:12px;}
.link-row{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,var(--tile1),var(--tile2));border:1px solid var(--tile-border);border-radius:16px;padding:10px 14px;text-decoration:none;color:var(--text);box-shadow:0 2px 0 rgba(0,0,0,.04);text-align:left;}
.icon{width:38px;height:38px;border-radius:10px;flex-shrink:0;overflow:hidden;}
.icon img{width:100%;height:100%;object-fit:cover;display:block;}
.link-text{flex:1;min-width:0;}
.link-title{font-weight:700;font-size:.95rem;}
.link-sub{font-size:.76rem;color:var(--muted);}
</style>
</head>

// Theme
const themeBtn=document.getElementById('themeToggle');
function applyTheme(t){document.body.dataset.theme=t;themeBtn.textContent=t==='dark'?'☀️':'🌙';}
applyTheme(store.get('lt_theme','dark'));
themeBtn.onclick=()=>{const t=document.body.dataset.theme==='dark'?'light':'dark';applyTheme(t);store.set('lt_theme',t);};

// Name (local display override only, sanitized as text)
const nameEl=document.getElementById('nameEl');
nameEl.textContent=name;
nameEl.onclick=()=>{
  const v=prompt('Your display name:',name);
  if(v!==null){
    const clean=v.trim().slice(0,60);
    if(clean){name=clean;store.set('lt_name',name);nameEl.textContent=name;}
  }
};

function escapeHtml(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
document.getElementById('linksList').innerHTML=links.map(l=>`
    <a class="link-row" href="${safeUrl(l.url)}" target="_blank" rel="noopener noreferrer nofollow">
      <div class="icon"><img src="${l.icon}" alt="${escapeHtml(l.title)} icon" loading="lazy" decoding="async"></div>
      <div class="link-text"><div class="link-title">${escapeHtml(l.title)}</div>${l.sub?`<div class="link-sub">${escapeHtml(l.sub)}</div>`:''}</div>
    </a>`).join('');
</script>
